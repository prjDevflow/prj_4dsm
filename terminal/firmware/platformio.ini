; Terminal de acesso (ESP32 DevKit V1).
;
; Ambientes:
;   esp32dev  firmware do terminal (padrao): pio run -t upload
;   bancada   ferramenta da I01, um teste por peca pela serial: pio run -e bancada -t upload
;   native    testes da logica pura (lib/core) no computador: pio test -e native
;
; Versoes fixas para o build ser reproduzivel (guia, secao 5.1). Trocar de versao so de proposito.

[platformio]
default_envs = esp32dev

[env]
test_framework = unity

; Base das duas placas. espressif32 7.1.3 traz o core Arduino 2.0.17.
[esp32_base]
platform = platformio/espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_flags = -Wall -Wextra

[env:esp32dev]
extends = esp32_base
build_src_filter = +<*> -<bancada/>

[env:bancada]
extends = esp32_base
build_src_filter = -<*> +<bancada/>
monitor_echo = yes
lib_deps =
    olikraus/U8g2@2.36.18
    miguelbalboa/MFRC522@1.4.12
    madhephaestus/ESP32Servo@3.2.1
    ricmoo/QRCode@0.0.1

; Testes no PC. Precisa de um GCC no sistema (no Windows: MinGW-w64, ver README).
[env:native]
platform = platformio/native@1.2.1
build_flags = -std=c++11

; Os mesmos testes no Windows sem GCC instalado: o PlatformIO baixa um MinGW proprio.
[env:native_win]
extends = env:native
platform = platformio/windows_x86@1.2.0
